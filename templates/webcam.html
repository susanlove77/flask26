<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세이프카 - 실시간 웹캠 분석</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='mainstyle.css') }}">
    <style>
        body {
            background-color: #0f172a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Pretendard', sans-serif;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            text-align: center;
        }

        .header-section {
            margin-bottom: 2rem;
        }

        .webcam-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #00d1b2, #0097a7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 비디오가 담길 바운더리 박스 */
        .video-wrapper {
            position: relative;
            background: #1e293b;
            border: 3px solid #334155;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 실제 영상이 들어갈 자리 */
        .video-stream {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #000;
        }

        /* 영상 위에 겹칠 상태창 (선택 사항) */
        .status-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 15px;
            background: rgba(0, 209, 178, 0.8);
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: white;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .btn-group {
            margin-top: 2.5rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .hero-btn {
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
        }

        .btn-home {
            background: rgba(255,255,255,0.05);
        }

        .btn-home:hover {
            background: rgba(255,255,255,0.15);
        }

        .btn-analysis {
            background: #00d1b2;
            color: #0f172a;
            border: none;
        }

        .btn-analysis:hover {
            background: #00b89c;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1 class="webcam-title">LIVE ANALYSIS</h1>
        <p style="color: #94a3b8;">실시간 AI 객체 탐지 및 도로 상황 분석</p>
    </div>

    <div class="video-wrapper">
        <div class="status-overlay">
            <div class="status-dot"></div>
            REC: LIVE STREAMING
        </div>
        
        <img src="{{ url_for('video_feed') }}" class="video-stream" onerror="this.src='https://via.placeholder.com/1280x720?text=Camera+Connecting...'">
    </div>

    <div class="btn-group">
        <a href="/" class="hero-btn btn-home">🏠 홈으로</a>
        <a href="/analyze/list" class="hero-btn btn-analysis">📊 분석 목록 보기</a>
    </div>
</div>

</body>
</html>
